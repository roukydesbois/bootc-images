---
name: Clean up old images
on:
  schedule:
    - cron: '30 11 * * 0'  # Sundays 11:30 UTC, after the daily 10:05 build
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-images.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete old ${{ matrix.image }} versions from ghcr.io
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [nas-argon-eon, my-private-os, surfacego3-os, public-node]
    # A package only exists once main has pushed it: don't fail a PR's
    # dry-run on a package that isn't there yet.
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    permissions:
      packages: write

    steps:
      # Keeps every image from the last 30 days, `latest` (plus the
      # surfacego3-os `gnome`/`kde` variants), and the 5 newest
      # tagged images older than that. Cosign signatures and multi-arch
      # children follow their parent image; orphaned signatures are deleted.
      # Older images can be restored from the version IDs in the job log.
      - name: Clean up ghcr.io package
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          package: ${{ github.event.repository.name }}/${{ matrix.image }}
          older-than: 30 days
          # gnome/kde: surfacego3-os desktop variants
          exclude-tags: latest,gnome,kde
          keep-n-tagged: 5
          delete-untagged: true
          delete-orphaned-images: true
          # PRs touching this workflow only report what would be deleted.
          dry-run: ${{ github.event_name == 'pull_request' }}

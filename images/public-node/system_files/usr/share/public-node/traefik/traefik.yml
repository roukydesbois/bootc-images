# Traefik static configuration (traefik.container). Routes live in
# dynamic/, one file per app.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

entryPoints:
  # HTTP to HTTPS is a low-priority route (dynamic/00-common.yml), not the
  # entrypoint redirection: on the public cluster that got in the way of
  # ACME HTTP-01 challenges
  web:
    address: ":80"
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
    # No read timeout: NetBird's gRPC streams (signal, management sync) stay
    # open for hours, and Traefik v3 cuts requests after 60 s by default.
    # Same as the public cluster.
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  # Dashboard, API and ping, on localhost only (SSH tunnel to look at it)
  traefik:
    address: "127.0.0.1:8080"

api:
  dashboard: true
  insecure: true

ping:
  entryPoint: traefik

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /data/acme.json
      # HTTP-01 on :80. Not TLS-ALPN-01: 443 also carries NetBird's TLS
      # passthrough.
      httpChallenge:
        entryPoint: web

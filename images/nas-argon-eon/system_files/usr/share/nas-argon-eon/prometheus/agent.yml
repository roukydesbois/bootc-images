# Prometheus agent on the NAS (prometheus-agent.container). Scrapes locally,
# pushes to thomelab's Prometheus (remote-write receiver, reachable over the
# NetBird mesh through the netbird-operator's network resource; thomelab-ops
# policy "evora - metrics", tcp/9090 only).
global:
  scrape_interval: 60s
  # Every series carries cluster="evora": the chart's default node rules on
  # thomelab cover this host too, and their descriptions read "on cluster evora".
  external_labels:
    cluster: evora

scrape_configs:
  # Same job name as the cluster's node exporters, so kube-prometheus-stack's
  # node rules and dashboards apply unchanged
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
    relabel_configs:
      - target_label: instance
        replacement: evora

remote_write:
  - url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

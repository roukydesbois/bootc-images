# Compressed swap in RAM (zram-generator): carcavelos has 4 GB and the image
# no swap partition. The apps use ~2.1 GB at rest; this absorbs the peaks
# (hourly backup, nightly bootc upgrade, Keycloak's first start) instead of
# the OOM killer.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100

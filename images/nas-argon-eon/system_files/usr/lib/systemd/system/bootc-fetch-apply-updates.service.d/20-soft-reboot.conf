# Weekly automatic update, as nas-update does it by hand: soft reboot when the
# new image keeps the kernel, initramfs and kernel arguments (userspace only,
# NFS and Garage back in a minute or two), a normal reboot otherwise. greenboot
# checks the boot either way and rolls back a bad image.
[Unit]
OnFailure=nas-notify-failure@%n.service

[Service]
# Not in the middle of a backup or a scrub: wait for them (up to 12 hours,
# then fail, which alerts, and the update waits for next week)
ExecStartPre=/bin/sh -c 'for i in $$(seq 1 144); do systemctl is-active --quiet nas-backup.service nas-btrfs-scrub@hdd4tb.service nas-btrfs-scrub@ssd2tb.service nas-btrfs-scrub@ssd1tb.service || exit 0; sleep 300; done; echo "backup or scrub still running after 12 hours, no update this week" >&2; exit 1'
TimeoutStartSec=13h
# ostree's recompiled SELinux policy makes every update look incompatible
# with a soft reboot: put the image's back first. '-': the update goes on
# (as a full reboot) if this step fails.
ExecStartPre=-/usr/libexec/bootc-images/sepolicy-match-image
ExecStart=
ExecStart=/usr/bin/bootc upgrade --apply --soft-reboot=auto --quiet

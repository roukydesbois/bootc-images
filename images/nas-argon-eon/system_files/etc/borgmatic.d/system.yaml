# The machine's own state, to rebuild the NAS on a new SD card (the OS is the
# image; this is what was set up on the machine). Same BorgBase repo as the
# data jobs. Repo URL, passphrase and SSH key are host-local (see
# /etc/nas-argon-eon/README); they're in this backup too, but restoring it
# needs the passphrase, so keep that one in the password manager as well.
repositories:
  - path: ${BORGBASE_REPO}
    label: borgbase
encryption_passcommand: cat /etc/nas-argon-eon/borg-passphrase
ssh_command: ssh -i /etc/nas-argon-eon/borgbase-ssh-key -o StrictHostKeyChecking=accept-new
retries: 3
retry_wait: 60
borg_exit_codes:
  - code: 107
    treat_as: error
# LUKS header backups, /etc changes from the image, bootc status
commands:
  - before: action
    when:
      - create
    run:
      - /usr/libexec/nas-argon-eon/system-backup-prepare
# Small and changes little: keep more history than the data jobs
keep_daily: 14
keep_weekly: 8
keep_monthly: 12
compression: auto,zstd,9
archive_name_format: "system-{now:%Y-%m-%d_%H-%M-%S}"
match_archives: "sh:system-*"
# /etc: exports, ntfy/borg secrets, NetBird's config, SSH host keys, users,
# Cockpit. /var/lib/netbird: the peer's identity (no re-enrollment needed).
# Not /var/home: nothing lives there that isn't elsewhere.
patterns:
  - R /etc
  - R /var/lib/netbird
  - R /var/lib/nas-argon-eon
# The repository check runs from nextcloud-data.yaml only (same repo for all jobs)
skip_actions:
  - check

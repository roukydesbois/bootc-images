# ntfy alert when the post-boot health check fails (which leads to a
# rollback)
[Unit]
OnFailure=nas-notify-failure@%n.service
# greenboot otherwise runs early in the boot (carcavelos' first boot failed
# its checks that way). Only after units that don't wait on the disks: NFS
# and Garage wait for Tang without a limit, the check script polls for them.
After=sshd.service netbird.service argononed.service argoneond.service

# Soft reboot when the new image keeps the same kernel, initramfs and kernel
# arguments: systemd restarts userspace only (every service on the new image)
# without going through firmware, GRUB and the kernel boot. A kernel change
# falls back to a normal reboot (--soft-reboot=auto). Either way the boot ends
# with greenboot's health check, as before.
[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --apply --soft-reboot=auto --quiet

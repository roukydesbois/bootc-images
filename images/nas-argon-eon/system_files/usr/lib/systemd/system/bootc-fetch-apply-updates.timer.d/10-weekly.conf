# Updates install and (soft-)reboot once a week, Sunday early morning
# (Europe/Paris on the host): after the nightly backup (03:30) has usually
# finished, and the update service waits for it if not. NFS and Garage are
# down for a minute or two with a soft reboot, a few minutes with a full one.
[Timer]
OnBootSec=
OnUnitInactiveSec=
OnCalendar=Sun *-*-* 06:00
RandomizedDelaySec=15min
Persistent=true

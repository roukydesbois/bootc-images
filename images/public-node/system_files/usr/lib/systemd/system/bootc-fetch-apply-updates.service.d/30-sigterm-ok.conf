# bootc upgrade --apply deploys the update, then starts the (soft) reboot,
# and the reboot stops this very service: it ended "killed, status=15/TERM",
# i.e. failed, every night (its OnFailure alert only stayed quiet because the
# reboot blocked it). By then the update is done, so SIGTERM is a success.
# A failed pull or deploy still exits non-zero and alerts.
[Service]
SuccessExitStatus=SIGTERM

---
# Keeps common/'s SSH keys file equal to the GitHub account's keys
# (https://github.com/<owner>.keys, one per device, managed in personal-ops
# tofu/github). When they differ it pushes branch ssh-keys-sync and opens a
# PR, reviewed like any other: a key only reaches a machine through an image
# update, never at login time.
name: Sync SSH keys
on:
  schedule:
    - cron: '20 9 * * *'  # daily, before the 10:05 build
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sync-ssh-keys.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Compare with GitHub and open a PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      KEYS_FILE: common/system_files/usr/share/bootc-images/ssh/roukydesbois.keys
      BRANCH: ssh-keys-sync
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Refuse anything that isn't a non-empty list of public keys (an
      # outage page, an empty answer): never open a PR that drops every key.
      - name: Fetch and check the account's keys
        run: |
          curl -fsS --retry 3 "https://github.com/${{ github.repository_owner }}.keys" > /tmp/keys
          test -s /tmp/keys
          if grep -v -E '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh.com|sk-ecdsa-sha2-nistp256@openssh.com) [A-Za-z0-9+/=]+$' /tmp/keys; then
            echo "::error::unexpected line(s) in the keys list above"; exit 1
          fi
          ssh-keygen -lf /tmp/keys

      - name: Open or update the PR
        run: |
          if cmp -s /tmp/keys "$KEYS_FILE"; then
            echo "Keys file is up to date."; exit 0
          fi
          diff -u "$KEYS_FILE" /tmp/keys || true
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "::notice::PR run: would open a PR with the diff above"; exit 0
          fi
          cp /tmp/keys "$KEYS_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "common: sync SSH keys from the GitHub account"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "common: sync SSH keys from the GitHub account" \
              --body "The account's SSH keys (https://github.com/${{ github.repository_owner }}.keys) changed: this updates \`common/\`'s keys file, so every image trusts the new list after its next update. Check the diff against the devices listed in personal-ops \`tofu/github/ssh-keys.auto.tfvars\`."
          fi
          # PRs opened with GITHUB_TOKEN don't trigger pull_request
          # workflows; a dispatched build on the branch only builds (images
          # are pushed from main only).
          gh workflow run build.yml --ref "$BRANCH"

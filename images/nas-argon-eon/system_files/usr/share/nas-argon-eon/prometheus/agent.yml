# Prometheus agent on the NAS (prometheus-agent.container). Scrapes locally,
# pushes to thomelab's Prometheus (remote-write receiver, reachable over the
# NetBird mesh through the netbird-operator's network resource; thomelab-ops
# policy "evora - metrics", tcp/9090 only).
global:
  scrape_interval: 60s
  # Every series carries cluster="evora": the chart's default node rules on
  # thomelab cover this host too, and their descriptions read "on cluster evora".
  external_labels:
    cluster: evora
    # Same labels as thomelab's own nodes: node is the hostname, role what
    # the host is (cp/worker there), and instance below reads
    # "<node> (<role>)", which Grafana's Nodes dashboards list.
    node: evora
    role: nas

scrape_configs:
  # Same job name as the cluster's node exporters, so kube-prometheus-stack's
  # node rules and dashboards apply unchanged
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
    relabel_configs:
      - target_label: instance
        replacement: "evora (nas)"
  # Disk SMART data (smartctl-exporter.container)
  - job_name: smartctl
    static_configs:
      - targets: ["127.0.0.1:9633"]
    relabel_configs:
      - target_label: instance
        replacement: "evora (nas)"
  # Garage's own metrics (admin API, published on the host). The token is
  # Garage's metrics_token from garage.toml, copied on the machine (README);
  # an empty file works when garage.toml sets none.
  - job_name: garage
    static_configs:
      - targets: ["127.0.0.1:3903"]
    authorization:
      credentials_file: /etc/prometheus/secrets/garage-metrics-token
    relabel_configs:
      - target_label: instance
        replacement: "evora (nas)"

remote_write:
  - url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

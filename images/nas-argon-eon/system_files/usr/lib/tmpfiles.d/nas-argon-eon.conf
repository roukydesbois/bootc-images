d /var/lib/nas-argon-eon 0755 root root -
# Logs of failed units from before the switch to common/ (now in
# /var/log/bootc-images/failures): still cleaned up after 90 days
d /var/log/nas-argon-eon/failures 0750 root root 90d
# The shared sender (common/) reads /etc/bootc-images/ntfy.env: point it at
# the NAS's existing file, unless one was created there already
L /etc/bootc-images/ntfy.env - - - - /etc/nas-argon-eon/ntfy.env
d /var/log/netbird 0755 root root -
# Prometheus agent write-ahead log (the image runs as nobody, 65534)
d /var/lib/prometheus-agent 0700 65534 65534 -

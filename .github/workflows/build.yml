---
name: Build container images
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  # Images are pushed as ghcr.io/<owner>/bootc-images/<image>
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Picks the images to build: the ones whose folder changed, or all of them
  # for scheduled/manual runs and changes to this workflow.
  changes:
    name: Select images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select images
        id: select
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Runner per image: the Pis are arm64, the Surface is amd64.
          declare -A RUNNERS=(
            [nas-argon-eon]=ubuntu-26.04-arm
            [my-private-os]=ubuntu-26.04-arm
            [surfacego3-os]=ubuntu-26.04
          )
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            push) base=$PUSH_BEFORE ;;
            *) base= ;;
          esac
          all=false
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            all=true
            changed=
          else
            changed=$(git diff --name-only "$base" HEAD)
            grep -qx '.github/workflows/build.yml' <<<"$changed" && all=true
          fi
          include=()
          for image in "${!RUNNERS[@]}"; do
            if $all || grep -q "^images/${image}/" <<<"$changed"; then
              # Secret names can't contain '-': nas-argon-eon -> SIGNING_SECRET_NAS_ARGON_EON
              secret="SIGNING_SECRET_$(tr 'a-z-' 'A-Z_' <<<"$image")"
              include+=("$(jq -nc --arg image "$image" --arg runner "${RUNNERS[$image]}" \
                --arg secret "$secret" '{image: $image, runner: $runner, secret: $secret}')")
            fi
          done
          matrix=$(printf '%s\n' "${include[@]}" | jq -sc '{include: map(select(. != null and . != ""))}')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Images to build: ${matrix}"

  build_push:
    name: Build and push ${{ matrix.image }}
    needs: changes
    if: fromJSON(needs.changes.outputs.matrix).include[0] != null
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: images/${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      # Registry must be lowercase
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"

          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail

          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v3.1.2'

      # One key per image: SIGNING_SECRET_NAS_ARGON_EON, SIGNING_SECRET_MY_PRIVATE_OS, ...
      # Each matches images/<image>/cosign.pub.
      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets[matrix.secret] }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      # Devices check the signature against the key in the image only
      # (sigstoreSigned + keyPath, no transparency log), so do the same here.
      - name: Verify signature with the committed key
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign verify --key cosign.pub --insecure-ignore-tlog=true \
            ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST} >/dev/null

      # Pull the pushed image the way `bootc upgrade` will on the device: with
      # the policy.json and registries.d shipped in the image. If this fails,
      # devices would silently stop updating.
      - name: Pull with the image's own signature policy
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          ref="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          # The policy entry must apply to this image: with its key swapped
          # for a missing one, the pull has to fail. Otherwise the default
          # (insecureAcceptAnything) would let the check below pass unchecked.
          rc=0
          podman run --rm -e REF="$ref" -e DIGEST="$DIGEST" "${IMAGE_NAME}:${DEFAULT_TAG}" sh -c '
              jq -e --arg ref "$REF" ".transports.docker[\$ref][0].keyPath = \"/nonexistent.pub\"" \
                /etc/containers/policy.json >/tmp/policy.json || exit 3
              skopeo copy --quiet --remove-signatures --policy /tmp/policy.json "docker://$REF@$DIGEST" oci:/var/tmp/policy-check' || rc=$?
          # 1 = skopeo refused the image; 0 = not checked; anything else = the test itself broke
          if [ "$rc" -ne 1 ]; then
            echo "::error::the signature policy doesn't apply to ${ref} (exit ${rc})"
            exit 1
          fi
          # --remove-signatures: the source is still verified, but an oci:
          # directory can't store the signatures it would otherwise copy.
          podman run --rm "${IMAGE_NAME}:${DEFAULT_TAG}" \
            skopeo copy --quiet --remove-signatures "docker://${ref}@${DIGEST}" oci:/var/tmp/policy-check

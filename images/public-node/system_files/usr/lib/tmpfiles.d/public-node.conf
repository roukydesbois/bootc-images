d /var/home/roukydesbois 0700 roukydesbois roukydesbois -
d /var/log/netbird 0755 root root -
# Traefik's ACME account and certificates
d /var/lib/traefik 0700 root root -
# NetBird: SQLite store and the proxy's certificates
d /var/lib/netbird 0700 root root -
d /var/lib/netbird/management 0700 root root -
# The proxy image runs as UID 1000 (netbird). tmpfiles resets owner and mode
# on every boot, so the owner must be the container's. /var/lib/netbird is
# root-only, so the host user that may also have UID 1000 can't get in.
d /var/lib/netbird/proxy-certs 0700 1000 1000 -
# Keycloak's Postgres: the image runs as UID 999 (postgres)
d /var/lib/keycloak 0700 root root -
d /var/lib/keycloak/postgres 0700 999 999 -
# Vaultwarden and ntfy run as UID 1000 (as on the cluster)
d /var/lib/vaultwarden 0700 1000 1000 -
d /var/lib/ntfy 0700 1000 1000 -
d /var/cache/ntfy 0700 1000 1000 -
# gatus check history, one dir per instance
d /var/lib/gatus 0700 root root -
d /var/lib/gatus/public 0700 root root -
d /var/lib/gatus/private 0700 root root -
# Backups: lock, staging dir for the dumps, BorgBase's SSH host key
d /var/lib/public-node 0700 root root -
d /var/lib/public-node/backup 0700 root root -
# Secrets placed by hand at cutover (README, "Secrets")
d /etc/public-node/secrets 0700 root root -
d /etc/public-node/secrets/netbird 0700 root root -
d /etc/public-node/secrets/keycloak 0700 root root -
d /etc/public-node/secrets/backup 0700 root root -
d /etc/public-node/secrets/vaultwarden 0700 root root -
d /etc/public-node/secrets/ntfy 0700 root root -
d /etc/public-node/secrets/gatus 0700 root root -

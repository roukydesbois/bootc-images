# Keys only, no root, admins only. Port 22 isn't open on the public
# interface (firewall.nft): SSH is reached over NetBird, or Tailscale when
# NetBird is down.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no
AllowGroups wheel
MaxAuthTries 3
X11Forwarding no
# The admin keys ship with the image (public keys, same as
# https://github.com/roukydesbois.keys), next to the usual per-user file
AuthorizedKeysFile .ssh/authorized_keys /usr/share/public-node/ssh/%u.keys

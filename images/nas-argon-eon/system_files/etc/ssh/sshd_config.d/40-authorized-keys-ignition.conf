# Ignition writes the user's keys to ~/.ssh/authorized_keys.d/ignition, which
# plain sshd doesn't read (Fedora CoreOS/IoT use ssh-key-dir for that, which
# isn't packaged for this image), so list that file next to the usual one.
# The image's own list comes last (common/: the GitHub account's keys, one
# per device, synced by a PR).
AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys.d/ignition /usr/share/bootc-images/ssh/%u.keys

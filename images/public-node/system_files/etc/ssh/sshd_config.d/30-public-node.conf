# Keys only, no root, admins only. Port 22 isn't open on the public
# interface (firewall.nft): SSH is reached over NetBird, or Tailscale when
# NetBird is down.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no
AllowGroups wheel
MaxAuthTries 3
X11Forwarding no
# The admin keys ship with the image (common/: the GitHub account's keys,
# one per device), next to the usual per-user file
AuthorizedKeysFile .ssh/authorized_keys /usr/share/bootc-images/ssh/%u.keys

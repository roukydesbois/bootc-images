# After a soft reboot the kernel, and its zram device (already sized, holding
# a swap signature), is still there, and systemd-zram-setup fails on it. Skip
# the setup then: the swap unit turns the existing device back on.
[Service]
ExecCondition=/bin/sh -c 'test "$$(cat /sys/block/%i/disksize 2>/dev/null || echo 0)" = 0'
